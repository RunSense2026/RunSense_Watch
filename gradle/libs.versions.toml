[versions]
agp = "9.3.2"
kotlin = "2.2.10"
playServicesWearable = "19.0.0"
composeBom = "2024.09.00"
composeMaterial = "1.2.1"
composeFoundation = "1.2.1"
wearToolingPreview = "1.0.0"
activityCompose = "1.12.1"
coreSplashscreen = "1.0.1"
healthServices = "1.1.0-rc02"
